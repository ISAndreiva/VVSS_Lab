webdriver {
  driver = chrome
  autodownload = true
}

# Implicit wait for elements (ms)
webdriver.timeouts.implicitlywait = 5000

serenity {
  project.name = "Demoblaze Web Tests"
  # Screenshots: FOR_FAILURES | AFTER_EACH_STEP | BEFORE_AND_AFTER_EACH_STEP
  take.screenshots = AFTER_EACH_STEP
  # Test root package for report grouping
  test.root = "demoblaze.tests"
}

# Uncomment to run Chrome in headless mode (no browser window):
chrome.switches = "--no-sandbox,--disable-dev-shm-usage,--headless=new,--disable-gpu,--window-size=1920,1080"
